<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--paper:#F3F5F4;--surface:#FFFFFF;--sunk:#E9EDEB;--ink:#1B2A31;--muted:#58676E;--line:#D5DCD9;--brand:#23525A;--brand-ink:#FFFFFF;
--c-weekly:#2E6BA3;--c-makeup:#B27A22;--c-sup:#7A4893;--c-oh:#2C8560;--warn:#8A5A00;--warn-bg:#FFF3D6;
font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--paper)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#141B1E;--surface:#1C2528;--sunk:#232E32;--ink:#E4ECEA;--muted:#98A8AD;--line:#33434A;--brand:#6FB3BC;--brand-ink:#0F1A1C;--c-weekly:#6AA6DD;--c-makeup:#E0AA55;--c-sup:#B990D0;--c-oh:#62C196;--warn:#F1C46B;--warn-bg:#3A2F14}}
:root[data-theme="dark"]{--paper:#141B1E;--surface:#1C2528;--sunk:#232E32;--ink:#E4ECEA;--muted:#98A8AD;--line:#33434A;--brand:#6FB3BC;--brand-ink:#0F1A1C;--c-weekly:#6AA6DD;--c-makeup:#E0AA55;--c-sup:#B990D0;--c-oh:#62C196;--warn:#F1C46B;--warn-bg:#3A2F14}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);font-size:15px;line-height:1.5}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
main{max-width:860px;margin:0 auto;padding:28px clamp(14px,4vw,32px) 60px}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:18px;margin:26px 0 8px}
.lede{color:var(--muted);margin:0 0 18px;max-width:70ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted);max-width:340px}
select{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:8px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.btns{display:flex;gap:8px;flex-wrap:wrap}
a.btn{display:inline-block;text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:8px 12px;font-weight:600;color:var(--ink);background:var(--surface)}
a.btn:hover{border-color:var(--muted)}
a.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.t-weekly{color:var(--c-weekly)}.t-makeup{color:var(--c-makeup)}.t-sup{color:var(--c-sup)}.t-oh{color:var(--c-oh)}
.title{font-weight:700;margin-top:3px}.detail{font-size:14px;color:var(--muted)}
.flag{display:inline-block;font-size:12px;font-weight:600;padding:1px 7px;border-radius:4px;background:var(--warn-bg);color:var(--warn)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
td{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td:last-child{white-space:normal}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:6px;background:var(--surface)}
.small{font-size:13px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 14px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
button.btn{border:1px solid var(--line);border-radius:6px;padding:8px 12px;font-weight:600;background:var(--surface);cursor:pointer}
button.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.calhead{display:flex;align-items:center;justify-content:space-between;margin:14px 0 8px}
.calhead b{font-size:18px}
.cal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.cal .dh{font-size:12px;font-weight:600;color:var(--muted);padding:6px;border-bottom:1px solid var(--line);text-align:center}
.cal .day{min-height:92px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;display:flex;flex-direction:column;gap:3px}
.cal .day:nth-child(5n){border-right:0}
.cal .day.out{background:var(--sunk)}
.cal .dn{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ev{display:block;width:100%;text-align:left;border:0;border-left:3px solid currentColor;border-radius:3px;padding:3px 5px;font-size:12px;line-height:1.3;cursor:pointer;background:color-mix(in srgb,currentColor 12%,var(--surface))}
.ev b{color:var(--ink);font-weight:700}
.ev span{color:var(--ink)}
.detail-pop{margin-top:10px}
@media (max-width:600px){.cal .day{min-height:70px}.ev span{display:none}}
.picks{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 12px}
.pick{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:6px;padding:7px 10px;cursor:pointer;background:var(--surface);font-size:14px}
.pick input{width:16px;height:16px;margin:0;accent-color:var(--brand)}
.pick .n{color:var(--muted);font-variant-numeric:tabular-nums}
.addcal h3{font-size:16px;margin:0 0 2px}
.status{margin-top:10px;padding:8px 12px;border-radius:6px;font-size:14px;font-weight:600}
.status.ok{background:color-mix(in srgb,var(--c-oh) 14%,var(--surface));color:var(--ink)}
.status.warn{background:var(--warn-bg);color:var(--warn)}
.status a{color:inherit;font-weight:700}
details.how{border-top:1px solid var(--line);padding:8px 0}
details.how:last-of-type{border-bottom:1px solid var(--line)}
details.how summary{cursor:pointer;font-weight:600;padding:2px 0}
details.how ol{margin:6px 0 4px;padding-left:22px}
details.how li{margin:3px 0}
.steps-h{font-weight:700;margin:16px 0 6px}
kbd{font:inherit;font-weight:700}

/* invoice */
body{color:var(--ink)}
.viewtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 18px}
.viewtabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font-weight:600;color:var(--muted);cursor:pointer}
.viewtabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand)}
.muted{color:var(--muted)}
.invhead{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:14px}
.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:14px}
.totals>div{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:6px;background:var(--sunk)}
.totals span{font-size:13px;color:var(--muted);font-weight:600}
.totals b{font-size:26px;line-height:1.15;font-variant-numeric:tabular-nums}
.totals .mine{background:color-mix(in srgb,var(--brand) 13%,var(--surface))}
.totals em{font-style:normal;font-size:13px;color:var(--muted)}
.howto{margin:0 0 18px;padding-left:22px;color:var(--muted);font-size:14px}
.howto li{margin:3px 0}.howto b{color:var(--ink)}
.igroup{margin-bottom:18px}
.ig-head h3{font-size:16px;margin:0}
.ig-head p{margin:2px 0 8px;font-size:13px;color:var(--muted)}
.ig-cols,.iline{display:grid;grid-template-columns:minmax(0,1fr) 70px 150px 90px;gap:6px 12px;align-items:center}
.ig-cols{font-size:12px;font-weight:600;color:var(--muted);padding:0 12px 4px}
.ig-cols span:nth-child(n+2){text-align:center}.ig-cols span:last-child{text-align:right}
.iline{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:6px}
.iline.chg{border-color:var(--warn);box-shadow:inset 3px 0 0 var(--warn)}
.il-main{min-width:0}
.il-name{font-weight:700}
.il-rate{font-size:13px;color:var(--muted)}

.il-help p{font-size:13px;margin:4px 0;max-width:62ch}
.il-dates{color:var(--muted)}
.il-sched{text-align:center;font-variant-numeric:tabular-nums}
.il-sched b{font-size:17px}
.lbl{display:none;font-size:12px;color:var(--muted);font-weight:600}
.il-qty{display:flex;justify-content:center}
.stepper{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.stepper button{border:0;background:var(--sunk);width:36px;font-size:18px;font-weight:700;cursor:pointer;color:var(--ink)}

.stepper input{width:56px;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);text-align:center;font:inherit;font-weight:700;font-size:16px;padding:7px 2px;background:var(--surface);color:var(--ink);-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.il-amt{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.il-note{grid-column:1/-1;display:flex;flex-direction:column;gap:4px;padding-top:6px;border-top:1px dashed var(--line)}
.il-note label{font-size:13px;font-weight:600;color:var(--warn)}

.il-note label.chk{display:flex;gap:8px;align-items:flex-start;color:var(--ink);font-weight:600}
.il-note label.chk input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--brand)}
.igrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.f2{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.f2.wide{grid-column:1/-1}
.f2 .static{font-weight:400;color:var(--ink);font-size:15px;padding:6px 0}
.status.need{background:var(--warn-bg);color:var(--ink);font-weight:400}

.status.need ul{margin:4px 0 0;padding-left:20px}

.ocline{display:grid;grid-template-columns:minmax(0,1fr) 160px auto;gap:6px 12px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:6px}

.ocline input{font:inherit;font-weight:400;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:8px;width:100%}
.ocline .btn.link{padding-bottom:9px}

table.rt td{white-space:normal}
@media (max-width:640px){
 .ig-cols{display:none}
 .iline{grid-template-columns:1fr auto;}
 .il-main{grid-column:1/-1}
 .il-sched{display:flex;gap:6px;align-items:baseline;justify-content:flex-start}
 .il-qty{grid-column:1;justify-content:flex-start;align-items:center;gap:8px}
 .il-amt{grid-column:2;grid-row:2/4;align-self:end}
 .lbl{display:inline}
}

function invMonths(id){const own=SNAP.sessions[id]||[];return uniqA(own.map(x=>x.date.slice(0,7))).sort();}
function defaultMonth(id){
  const ms=invMonths(id),now=today().slice(0,7),day=+today().slice(8);

function invNo(id,m,bill){

function calc(){
  const{id,m}=IE;const ex=expected(id,m);
  const rows=LINES.map(L=>{const e=ex.q[L.k];const n=IE.q[L.k]!==undefined?IE.q[L.k]:e;const r=RATES[L.k]||{hrs:0,rate:0};const amt=Math.round(n*per(L.k)*100)/100;return{L,e,n,hrs:+r.hrs||0,rate:+r.rate||0,amt,det:ex.det[L.k],changed:n!==e,note:(IE.notes[L.k]||"").trim()};});
  const oc=(IE.oc||[]).map(r=>({d:String(r.d||"").trim(),a:Math.round((+r.a||0)*100)/100}));
  const ocT=Math.round(oc.reduce((n,r)=>n+(r.a>0?r.a:0),0)*100)/100;
  const total=Math.round((rows.reduce((a,r)=>a+r.amt,0)+ocT)*100)/100,est=Math.round(rows.reduce((a,r)=>a+r.e*per(r.L.k),0)*100)/100;
  const dt=IE.dt||today();const no=IE.no||invNo(id,m);const due=addD(dt,30);
  const ahead=(SNAP.sessions[id]||[]).filter(x=>x.date.slice(0,7)===m&&x.date>today()).length;
  const warn=[];
  if(m>today().slice(0,7))warn.push(["warn",`${monthLong(m)} hasn't started yet. These counts are the plan, so check them again at the end of the month.`]);
  else if(ahead)warn.push(["warn",`${monthLong(m)} isn't over yet. ${ahead} scheduled session${ahead>1?"s are":" is"} still ahead, so check the counts again before you send.`]);
  rows.filter(r=>r.changed&&!r.note&&!r.L.ask).forEach(r=>warn.push(["need",`Add a short note on ${r.L.l.toLowerCase()} saying what changed from the schedule.`]));
  rows.filter(r=>r.L.ask&&r.n>0&&!r.note).forEach(r=>warn.push(["need",`Add who and when for your ${r.L.l.toLowerCase()}.`]));
  if(IE.q.ext>0&&!IE.ap)warn.push(["need","Confirm that Neal and Christine approved each extenuating circumstance makeup before it was scheduled."]);
  if(!IP.bill.trim())warn.push(["need","Add your name or business name under Invoice details."]);
  if(oc.some(r=>r.a>0&&!r.d))warn.push(["need","Add a short description for each other charge."]);
  if(oc.some(r=>r.d&&!(r.a>0)))warn.push(["need","Add an amount for each other charge, or remove it."]);
  if(total<0)warn.push(["need","The total is below zero. Check the missed and covered counts."]);

}
